[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "learning-agent"
version = "0.1.0"
description = "A learning-first agent that explains and consults personal materials"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.35,<1", "httpx[socks]>=0.28,<1", "pydantic-settings>=2.10,<3", "python-multipart>=0.0.20,<1", "pypdfium2>=4.30,<6", "pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "reportlab>=4,<5"]
asr = ["faster-whisper>=1.1,<2"]
ocr = ["rapidocr-onnxruntime>=1.3,<2"]
embed = ["fastembed>=0.7,<1"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
learning-agent-mcp = "learning_agent.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 测试临时目录与缓存统一放到 /tmp，不污染项目根目录
addopts = "--basetemp=/tmp/learning-agent-pytest-tmp"
cache_dir = "/tmp/learning-agent-pytest-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_agent"]

[tool.ruff]
line-length = 100
