<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Agent · 评测审查</title><link rel="icon" href="data:,">
<style>body{font:15px/1.65 system-ui;background:#f4f6f3;color:#24362f;margin:auto;max-width:1200px;padding:24px}h1{font-size:24px}a{color:#255e43}select,button{font:inherit;padding:8px;margin:4px}article,section{background:white;border:1px solid #d7e1d9;border-radius:10px;padding:18px;margin:14px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f2;padding:12px;max-height:380px;overflow:auto}img{max-width:100%;max-height:450px;object-fit:contain}small{color:#53665b}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.split{grid-template-columns:1fr}table{font-size:12px}}</style>
<h1>评测与失败分析</h1><p><a href="/">返回学习</a> · 本地只读开发视图；执行状态、内容复核、真实学习收益分别判断。</p><label>实验 <select id="experiments"></select></label><button id="refresh">刷新</button><p id="notice" role="status"></p><section id="summary"></section><div id="pairs"></div><div id="details"></div>
<script>
const $=id=>document.getElementById(id);let eid='',rows=[],version=0;
function el(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n;}
async function api(url){const r=await fetch(url);if(!r.ok)throw Error('读取失败 '+r.status);return r.json();}
async function load(){const binding=++version;eid=$('experiments').value;if(!eid)return;const data=await api('/api/evaluations/'+encodeURIComponent(eid));if(binding!==version)return;rows=data.rows;$('summary').replaceChildren();el('p',`${data.manifest?.kind==='authored_judge_calibration'?'手写裁判校准（未运行Agent） · ':''}计划 ${data.planned} 回合 · 内容复核 ${data.reviewed}/${data.planned} · 中位墙钟 ${data.median_wall_s??'未知'} 秒`,$('summary'));el('pre',JSON.stringify({状态:data.counts,操作用量:data.usage,已预留:data.reservations},null,2),$('summary'));$('pairs').replaceChildren();$('details').replaceChildren();const groups=new Map();for(const r of rows){const key=r.case_id+'/'+r.turn_id+'/'+r.repeat;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);}for(const [key,items] of groups){const card=el('section',undefined,$('pairs'));el('h2',key,card);const grid=el('div',undefined,card);grid.className='split';for(const row of items){const panel=el('article',undefined,grid);el('h3',row.variant,panel);el('p',`${row.status} · 运行状态 ${row.runtime_state??'未运行'} · 内容复核 ${row.review?.status??'待复核'}`,panel);el('p',`墙钟 ${row.latency.wall_s?.toFixed(2)??'未知'} 秒 · 首草稿 ${row.latency.first_draft_s?.toFixed(2)??'无'} 秒`,panel);if(!row.timing_comparable)el('p','含中断/等待，墙钟不用于速度优劣比较',panel);const button=el('button','查看答案、证据与执行轨迹',panel);button.onclick=()=>detail(row);}}}
async function detail(row){const selected=eid,binding=version;const result=await api(`/api/evaluations/${encodeURIComponent(eid)}/trials/${encodeURIComponent(row.trial_id)}`);if(binding!==version||selected!==eid)return;const item=result.rows.find(r=>r.turn_id===row.turn_id);$('details').replaceChildren();el('h2',row.variant+' · '+row.case_id+' / '+row.turn_id,$('details'));el('h3','问题与正式答案',$('details'));el('p',item.question,$('details'));el('pre',item.answer||'无正式答案；草稿不作为评分答案',$('details'));el('h3','复核与失败依据',$('details'));el('pre',JSON.stringify({复核:item.review,规则:item.checks,候选问题:item.findings},null,2),$('details'));el('h3','操作与实际输入',$('details'));for(const op of item.trace?.operations||[]){const card=el('article',undefined,$('details'));el('h4',`${op.purpose} · ${op.logical_key} · attempt ${op.attempt} · ${op.state}`,card);el('pre',JSON.stringify({id:op.id,usage:op.usage,input:op.input_ref},null,2),card);for(const e of op.input_ref?.evidence||[]){for(const loc of [e,...(e.hits||[])]){const asset=Object.entries(item.assets||{}).find(([alias,a])=>a.id===(loc.material_id||loc.id));if(asset&&(loc.page||loc.start_seconds!==undefined)){const a=el('a',loc.page?'查看原始PDF第'+loc.page+'页':'回听片段 '+loc.start_seconds+'–'+loc.end_seconds+'秒',card);a.href=`/api/evaluations/${eid}/sources/${row.trial_id}/${asset[0]}`+(loc.page?'#page='+loc.page:'#t='+loc.start_seconds+','+loc.end_seconds);a.target='_blank';a.rel='noopener';el('br',undefined,card);}}}for(let i=0;i<(op.input_ref?.images||[]).length;i++){const img=el('img',undefined,card);img.alt='该次模型请求实际附加的图片';img.src=`/api/evaluations/${eid}/images/${row.trial_id}/${op.id}/${i}`;}}el('h3','回看原资料',$('details'));for(const [alias,asset] of Object.entries(item.assets||{})){const a=el('a',asset.name,$('details'));a.href=`/api/evaluations/${eid}/sources/${row.trial_id}/${alias}`;a.target='_blank';a.rel='noopener';el('br',undefined,$('details'));}el('details',undefined,$('details'));const events=$('details').lastChild;el('summary','持久事件时间线',events);el('pre',JSON.stringify(item.trace?.events||[],null,2),events);$('details').scrollIntoView({behavior:'smooth'});}
async function init(){try{const old=$('experiments').value;const experiments=await api('/api/evaluations');$('experiments').replaceChildren();for(const e of experiments){const option=el('option',e.id,$('experiments'));option.value=e.id;}if(experiments.some(e=>e.id===old))$('experiments').value=old;if(!experiments.length)$('notice').textContent='尚无统一评测结果。请先按文档运行评测CLI。';else{$('notice').textContent='生成中的实验可刷新；待复核不会显示为教学通过。';await load();}}catch(error){$('notice').textContent=error.message;}}
$('experiments').onchange=()=>load().catch(e=>$('notice').textContent=e.message);$('refresh').onclick=init;init();
</script></html>
