<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Agent</title><link rel="icon" href="data:,">
<style>
:root{font:15px/1.7 system-ui;color:#20312d;background:#f5f6f2}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #dce3dc}h1{font-size:22px;margin:0}p{margin:8px 0;color:#53675e}main{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1180px;margin:auto;padding:24px}aside,section{background:white;padding:20px;border:1px solid #dce3dc;border-radius:12px;min-width:0}input,select,textarea,button{font:inherit;border:1px solid #cbd5cc;border-radius:6px;padding:8px;width:100%;margin:5px 0}button{cursor:pointer;background:#e7efe7}button:disabled{opacity:.5}textarea{resize:vertical}article{padding:18px 0;border-bottom:1px solid #edf0ec}article .body,pre{white-space:pre-wrap;overflow-wrap:anywhere}pre{font:13px/1.6 ui-monospace,monospace;max-height:250px;overflow:auto;background:#f5f6f2;padding:12px}.error{color:#9b3d29}label{display:block;margin-top:16px}small{color:#64756b}#notice{min-height:28px}details{margin-top:10px}#chat{min-height:250px}a{color:#38634b}ul{padding-left:18px}@media(max-width:740px){main{grid-template-columns:1fr}}
</style>
<header><h1>Learning Agent · 学懂当前的困惑</h1><p>上传文字资料，提出问题，再通过追问调整讲解。这是新项目的第一阶段。</p><small id="status">正在检查配置…</small></header>
<main><aside><h3>资料空间</h3><select id="spaces" aria-label="资料空间"></select><form id="space-form"><input id="space-name" placeholder="新空间名称" required maxlength="120"><button>创建空间</button></form>
<form id="upload-form"><label>添加 TXT / Markdown<input id="file" type="file" accept=".txt,.md" required></label><button>上传文字资料</button></form><ul id="materials"></ul>
<label>学习会话<select id="conversations"></select></label><button id="new-conversation">新建会话</button><p><small>图表、PDF 和影音工具尚未实现。资料片段与对话将发送给配置的模型服务。</small></p></aside>
<section><div id="notice" role="status" aria-live="polite"></div><div id="chat"></div><form id="ask-form"><label for="question">你想弄懂什么？</label><textarea id="question" rows="3" required maxlength="6000" placeholder="这段内容我没懂，能换个例子解释吗？"></textarea><button id="send">提问 / 继续追问</button></form></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let space='',conversation='',configured=false,busy=false;
async function api(path,options={}){const response=await fetch('/api'+path,options);const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
const post=(path,content)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':''}
function availability(){for(const id of ['send','spaces','conversations','new-conversation'])$(id).disabled=busy; document.querySelectorAll('#space-form input,#space-form button,#upload-form input,#upload-form button').forEach(el=>el.disabled=busy); $('send').disabled=busy||!conversation||!configured}
async function loadSpaces(){const items=await api('/spaces');$('spaces').innerHTML=items.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');space=items.find(s=>s.id===localStorage.getItem('learning-space'))?.id||items[0]?.id||'';$('spaces').value=space;await loadSpace()}
async function loadSpace(){localStorage.setItem('learning-space',space);const items=space?await api(`/spaces/${space}/materials`):[];$('materials').innerHTML=items.map(m=>`<li><button type="button" data-material="${m.id}">${esc(m.name)}</button></li>`).join('');const conversations=space?await api(`/spaces/${space}/conversations`):[];$('conversations').innerHTML=conversations.map(c=>`<option value="${c.id}">${c.id.slice(0,8)}</option>`).join('');conversation=conversations.find(c=>c.id===conversation)?.id||conversations[0]?.id||'';$('conversations').value=conversation;await loadChat()}
async function loadChat(){const messages=conversation?await api(`/conversations/${conversation}/messages`):[];$('chat').innerHTML=messages.map(m=>`<article><small>${m.role==='user'?'你的问题':'讲解'}</small><div class="body">${esc(m.content)}</div>${m.role==='assistant'&&m.run_id?`<details data-run="${m.run_id}"><summary>查看本轮工具与执行状态</summary><pre>展开后加载</pre></details>`:''}</article>`).join('')||'<p>创建会话后提出困惑。你可以直接追问，不必按固定学习流程操作。</p>';availability()}
$('spaces').onchange=()=>{space=$('spaces').value;loadSpace().catch(e=>notice(e.message,true))};$('conversations').onchange=()=>{conversation=$('conversations').value;loadChat().catch(e=>notice(e.message,true))};
$('space-form').onsubmit=async e=>{e.preventDefault();try{const item=await post('/spaces',$('space-name').value);localStorage.setItem('learning-space',item.id);await loadSpaces();notice('资料空间已创建')}catch(e){notice(e.message,true)}};
$('upload-form').onsubmit=async e=>{e.preventDefault();if(!space)return notice('请先创建资料空间',true);try{const data=new FormData();data.append('file',$('file').files[0]);await api(`/spaces/${space}/materials`,{method:'POST',body:data});await loadSpace();notice('资料已就绪')}catch(e){notice(e.message,true)}};
$('new-conversation').onclick=async()=>{if(!space)return notice('请先创建资料空间',true);try{const c=await api(`/spaces/${space}/conversations`,{method:'POST'});await loadSpace();conversation=c.id;$('conversations').value=c.id;await loadChat()}catch(e){notice(e.message,true)}};
$('ask-form').onsubmit=async e=>{e.preventDefault();if(busy||!conversation)return;busy=true;availability();notice('正在理解问题并按需查阅资料…');try{const r=await post(`/conversations/${conversation}/messages`,$('question').value);$('question').value='';await loadChat();notice(r.state==='completed'?'本轮讲解已完成，可以继续追问。':r.answer,r.state==='failed')}catch(e){notice(e.message,true);await loadChat()}finally{busy=false;availability()}};
$('chat').addEventListener('toggle',async e=>{const d=e.target;if(!d.open||!d.dataset.run)return;try{const r=await api(`/runs/${d.dataset.run}`);d.querySelector('pre').textContent=JSON.stringify(r,null,2)}catch(e){notice(e.message,true)}},true);
$('materials').onclick=async e=>{const id=e.target.dataset.material;if(!id)return;try{const m=await api(`/spaces/${space}/materials/${id}`);const d=document.createElement('details');d.open=true;const s=document.createElement('summary');s.textContent=m.name;const p=document.createElement('pre');p.textContent=m.text;d.append(s,p);$('chat').prepend(d)}catch(e){notice(e.message,true)}};
(async()=>{try{const s=await api('/status');configured=s.configured;$('status').textContent=`模型：${s.model} · 协议：${s.protocol} · ${configured?'已配置，实际能力待验证':'未配置 API key，可先整理资料'}`;await loadSpaces()}catch(e){notice(e.message,true)}})();
</script></html>
