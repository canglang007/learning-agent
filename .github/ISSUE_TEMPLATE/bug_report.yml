name: Bug report
description: 报告可复现的问题（请先移除密钥和私人资料）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本项目是本机单用户项目。请勿粘贴 API key、认证头、私人课程文件或可识别对话。
        安全漏洞请使用 private security advisory，不要开公开 Issue。
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、uv、Docker（如使用）
      placeholder: "macOS 15, Python 3.13, uv 0.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动到问题发生的最小步骤
      placeholder: "1. ./start.sh ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
      description: 请移除密钥、资料正文和个人信息
    validations:
      required: true
  - type: checkboxes
    id: redacted
    attributes:
      label: 确认
      options:
        - label: 我已移除 API key、私人资料和可识别对话
          required: true
