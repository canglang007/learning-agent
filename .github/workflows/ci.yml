name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_public.py
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run pytest -q
      - run: uv run ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t learning-agent:ci .
