name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_public.py
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run pytest -q
      - run: uv run ruff check .
      # 任务集/基线的完整性检查，不调用模型、不依赖忽略的 data/；
      # 真实质量门禁需冻结报告，按 docs/evaluation-loop.md 显式运行。
      - run: uv run python scripts/check_evaluation.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t learning-agent:ci .
